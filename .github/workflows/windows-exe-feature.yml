name: Windows EXE - article cost label designer branch

on:
  push:
    branches:
      - feat/article-cost-label-designer-sales-calendar
    paths:
      - '.github/workflows/windows-exe-feature.yml'
      - 'api/**'
      - 'frontend/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'electron-builder*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-exe:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout selected feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/article-cost-label-designer-sales-calendar
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Windows EXE only (no tests)
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: POSNIC-Windows-EXE-feature-branch
          path: |
            dist/*.exe
          if-no-files-found: error
          retention-days: 14
