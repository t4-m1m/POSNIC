name: Windows EXE - article cost label designer branch

on:
  push:
    branches:
      - feat/article-cost-label-designer-sales-calendar
    paths:
      - '.github/workflows/windows-exe-feature.yml'
      - 'api/**'
      - 'frontend/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'electron-builder*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-exe:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout selected feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/article-cost-label-designer-sales-calendar
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install frontend build dependencies
        run: npm ci --prefix frontend
      - name: Install API runtime dependencies
        run: npm ci --prefix api --omit=dev
      - name: Fetch the bundled MongoDB binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $versionLine = Select-String -Path 'src/download-mongodb.bat' -Pattern '^set MONGODB_VERSION=([0-9.]+)'
          if (-not $versionLine) { throw 'Could not read pinned MongoDB version from src/download-mongodb.bat' }
          $version = $versionLine.Matches[0].Groups[1].Value
          $url = "https://fastdl.mongodb.org/windows/mongodb-windows-x86_64-$version.zip"
          Invoke-WebRequest -Uri $url -OutFile mongodb.zip
          Expand-Archive -Path mongodb.zip -DestinationPath mongodb-temp -Force
          New-Item -ItemType Directory -Force -Path mongodb/bin | Out-Null
          $mongo = Get-ChildItem -Path mongodb-temp -Filter mongod.exe -Recurse | Select-Object -First 1
          if (-not $mongo) { throw "mongod.exe missing from MongoDB $version archive" }
          Copy-Item $mongo.FullName mongodb/bin/mongod.exe
          Remove-Item mongodb.zip -Force
          Remove-Item mongodb-temp -Recurse -Force
          node scripts/check-mongodb-binaries.js
      - name: Build Windows installer and portable EXE (no tests)
        run: |
          npm run build
          npm run build:portable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Windows installer and standalone EXE
        uses: actions/upload-artifact@v4
        with:
          name: POSNIC-Windows-EXE-feature-branch
          path: |
            dist/*.exe
          if-no-files-found: error
          retention-days: 14
