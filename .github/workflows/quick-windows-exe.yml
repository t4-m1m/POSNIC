name: Quick Windows Installer EXE (no tests)
# Build the current feature-branch snapshot as the Windows installer only; deliberately no test steps.
# Authorized installer build for the current payment-modal changes; restore manual-only after completion.

on:
  workflow_dispatch:
  push:
    branches:
      - feat/article-cost-label-designer-sales-calendar

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer only without running tests
    runs-on: windows-latest
    env:
      POSNIC_MINIFY: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Fetch bundled MongoDB
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep -oE 'set MONGODB_VERSION=[0-9.]+' src/download-mongodb.bat | cut -d= -f2)
          curl -fsSL -o mongodb.zip "https://fastdl.mongodb.org/windows/mongodb-windows-x86_64-${VERSION}.zip"
          7z x -bso0 mongodb.zip -omongodb-temp
          mkdir -p mongodb/bin
          cp "mongodb-temp/mongodb-win32-x86_64-windows-${VERSION}/bin/mongod.exe" mongodb/bin/
          for dll in msvcp140.dll vcruntime140.dll vcruntime140_1.dll; do
            cp "/c/Windows/System32/$dll" mongodb/bin/
          done
          rm -rf mongodb.zip mongodb-temp
          node scripts/check-mongodb-binaries.js

      - name: Prepare bundled app resources
        run: npm run prepare:bundle

      - name: Build Windows installer only
        run: npx electron-builder --win nsis --x64 --publish never --config.compression=maximum --config.win.verifyUpdateCodeSignature=false

      - name: Normalize installer filename
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path "dist/*-windows-x64-installer.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows installer, found $($installers.Count)."
          }
          Move-Item -LiteralPath $installers[0].FullName -Destination "dist/Posnic-Windows-Installer.exe" -Force

      - name: Mirror installer to GoFile (free third-party host)
        id: gofile
        continue-on-error: true
        shell: pwsh
        run: |
          $installer = Get-Item "dist/Posnic-Windows-Installer.exe"
          $response = Invoke-RestMethod -Uri "https://upload.gofile.is/uploadfile" -Method Post -Form @{ file = $installer }
          if ($response.status -ne "ok") {
            throw "GoFile upload failed: $($response.status)"
          }
          $url = $response.data.downloadPage
          if (-not $url -and $response.data.code) {
            $url = "https://gofile.is/d/$($response.data.code)"
          }
          if (-not $url) {
            throw "GoFile upload returned no share URL."
          }
          "download_url=$url" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "### Alternative installer download (GoFile)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "$url" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: Posnic-Windows-Installer
          path: dist/Posnic-Windows-Installer.exe
          if-no-files-found: error
          retention-days: 7

      - name: Publish installer to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: installer-${{ github.run_number }}
          name: POSNIC Windows Installer (build ${{ github.run_number }})
          body: |
            Automatically published Windows installer from the successful POSNIC installer build.

            **Alternative download (GoFile):** ${{ steps.gofile.outputs.download_url || 'GoFile mirror unavailable for this build; use the GitHub asset below.' }}

            Download **Posnic-Windows-Installer.exe** below. This release contains the installer only.
          files: dist/Posnic-Windows-Installer.exe
          draft: false
          prerelease: false
          make_latest: true
