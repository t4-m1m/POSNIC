name: Quick Windows Installer EXE (accounting tests)
# Priority rebuild requested 2026-10-27; branch concurrency cancels the older installer run.
# Priority rebuild retry requested 2026-10-27 19:14 local.
# Build the current feature-branch snapshot as the Windows installer only; run focused accounting-engine unit tests.
# Build the installer on each push to the active feature branch; manual dispatch remains available.
# 2026-11-16: user-requested rebuild of the current feature-branch snapshot (packaging trigger only; no application code changes).
# 2026-11-26: V2 legacy-style thermal receipt, deferred F6 stock/accounting and visible split-tender history.

on:
  push:
    branches:
      - feat/article-cost-label-designer-sales-calendar
      - feat/posnic-v2-rebrand
  workflow_dispatch:

permissions:
  contents: write

# Only build the newest snapshot; rapid fix commits must not publish stale installers.
concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows installer after focused accounting tests
    runs-on: windows-latest
    env:
      POSNIC_MINIFY: "0"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Verify or create protected SamarinaPOS V3.0 release tag
        if: github.ref == 'refs/heads/feat/posnic-v2-rebrand'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v3.0.0'
          git fetch --no-tags origin "refs/tags/${tag}:refs/tags/${tag}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Creating immutable release tag $tag at the current branch commit."
            git tag $tag $env:GITHUB_SHA
            git push origin "refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw "Could not create the V3.0 release tag $tag." }
          } else {
            Write-Host "Using existing protected tag $tag; building current branch commit $env:GITHUB_SHA without moving the tag."
          }

      - name: Exclude workspace from Microsoft Defender scanning
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "${{ github.workspace }}"

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Cache Electron and electron-builder downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Install root dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Validate Windows workflow YAML syntax
        run: node -e "const fs=require('node:fs'); require('js-yaml').load(fs.readFileSync('.github/workflows/quick-windows-exe.yml','utf8')); console.log('Workflow YAML syntax is valid.');"

      - name: Verify packaged desktop frontend and unsigned Windows configuration
        run: |
          node -e "const p=require('./package.json'); const files=p.build.files||[]; const resources=p.build.extraResources||[]; const win=p.build.win||{}; if(p.main!=='src/main.js') throw new Error('Electron main entry must be src/main.js'); if(!files.includes('frontend-v2/**/*')) throw new Error('frontend-v2 is missing from the packaged app'); if(!resources.some(x=>x.from==='frontend/mobile'&&x.to==='frontend/mobile')) throw new Error('Samarina Companion assets are missing from extraResources'); if(win.verifyUpdateCodeSignature!==false||win.signAndEditExecutable!==false) throw new Error('Windows build must not require a signing certificate'); console.log('Desktop frontend, Companion resources and unsigned x64 installer configuration verified.');"

      - name: Install API dependencies
        working-directory: api
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Run accounting, register, stock journal and quantity audit tests
        working-directory: api
        run: npx jest -c jest.ci.config.js tests/unit/services/accounting-engine.test.js tests/unit/controllers/sales.controller.test.js tests/unit/services/register.service.test.js tests/unit/controllers/versements.controller.test.js tests/unit/repositories/stock-log.repository.test.js tests/unit/repositories/register.repository.test.js tests/unit/services/item-family.test.js --runInBand --forceExit && node --test tests/unit/services/executive-dashboard.service.test.js && npx jest -c jest.ci.config.js tests/unit/repositories/item.repository.test.js --runInBand --forceExit --testNamePattern=updateItemQuantity && node --test ../tests/receipt-studio-v2.test.js

      - name: Syntax-check frontend and every API source file
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          node --check api/app.js
          node --check frontend-v2/core/receipt-designer.mjs
          $javascriptFiles = @(
            Get-ChildItem -Path frontend-v2 -Recurse -File -Filter *.js
            Get-ChildItem -Path api/src -Recurse -File -Filter *.js
          )
          foreach ($file in $javascriptFiles) {
            Write-Host "Checking $($file.FullName)"
            node --check $file.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "JavaScript syntax check failed: $($file.FullName)"
            }
          }

      - name: Fetch bundled MongoDB
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep -oE 'set MONGODB_VERSION=[0-9.]+' src/download-mongodb.bat | cut -d= -f2)
          curl -fsSL -o mongodb.zip "https://fastdl.mongodb.org/windows/mongodb-windows-x86_64-${VERSION}.zip"
          7z x -bso0 mongodb.zip -omongodb-temp
          mkdir -p mongodb/bin
          cp "mongodb-temp/mongodb-win32-x86_64-windows-${VERSION}/bin/mongod.exe" mongodb/bin/
          for dll in msvcp140.dll vcruntime140.dll vcruntime140_1.dll; do
            cp "/c/Windows/System32/$dll" mongodb/bin/
          done
          rm -rf mongodb.zip mongodb-temp
          node scripts/check-mongodb-binaries.js

      - name: Run MongoDB-backed register-close and stock-journal integration tests
        working-directory: api
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:MONGOMS_SYSTEM_BINARY = (Resolve-Path "../mongodb/bin/mongod.exe").Path
          node --test tests/business-register-close.integration.cjs tests/extension-stock-journal.integration.cjs

      - name: Prepare bundled app resources
        run: npm run prepare:bundle

      - name: Build Windows installer only
        run: npx electron-builder --win nsis --x64 --publish never --config.compression=normal --config.win.verifyUpdateCodeSignature=false

      - name: Normalize installer filename
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path "dist/*-windows-x64-installer.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows installer, found $($installers.Count)."
          }
          Move-Item -LiteralPath $installers[0].FullName -Destination "dist/SamarinaPOS-Windows-Installer.exe" -Force

      - name: Mirror installer to GoFile (free third-party host)
        id: gofile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-Item 'dist/SamarinaPOS-Windows-Installer.exe'
          Write-Host "Uploading $($installer.Name) ($($installer.Length) bytes) to GoFile."
          $response = Invoke-RestMethod -Uri 'https://upload.gofile.io/uploadfile' -Method Post -Form @{ file = $installer } -TimeoutSec 3600
          if ($response.status -ne 'ok' -or -not $response.data) { throw "GoFile upload failed: $($response.status)" }
          $url = [string]$response.data.downloadPage
          if ([string]::IsNullOrWhiteSpace($url) -and $response.data.parentFolderCode) { $url = "https://gofile.io/d/$($response.data.parentFolderCode)" }
          if ([string]::IsNullOrWhiteSpace($url) -and $response.data.code) { $url = "https://gofile.io/d/$($response.data.code)" }
          if ([string]::IsNullOrWhiteSpace($url)) { throw 'GoFile upload returned no share URL.' }
          $parsedUrl = [uri]$url
          if ($parsedUrl.Scheme -ne 'https' -or $parsedUrl.Host -notin @('gofile.io','www.gofile.io','gofile.is','www.gofile.is')) { throw 'GoFile returned an invalid HTTPS share URL.' }
          "download_url=$url" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          '### Alternative installer download (GoFile)' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $url | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Write-Host "GoFile upload confirmed: $url"
      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: SamarinaPOS-Windows-Installer
          path: dist/SamarinaPOS-Windows-Installer.exe
          if-no-files-found: error
          retention-days: 7

      - name: Publish SamarinaPOS V3.0 installer release
        if: github.ref == 'refs/heads/feat/posnic-v2-rebrand' || startsWith(github.ref, 'refs/tags/v3.0.0')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GOFILE_URL: ${{ steps.gofile.outputs.download_url }}
        run: |
          $ErrorActionPreference = 'Stop'
          $owner = 't4-m1m'
          $repo = 'POSNIC'
          $tag = if ($env:GITHUB_REF.StartsWith('refs/tags/')) { $env:GITHUB_REF_NAME } else { 'v3.0.0' }
          $installer = Get-Item 'dist/SamarinaPOS-Windows-Installer.exe'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $api = "https://api.github.com/repos/$owner/$repo"
          if ([string]::IsNullOrWhiteSpace($env:GOFILE_URL)) { throw 'GoFile upload did not produce a verified share URL; refusing to publish a misleading release.' }
          if ([string]::IsNullOrWhiteSpace($env:GOFILE_URL)) { throw 'GoFile upload did not produce a verified share URL; refusing to publish a misleading release.' }
          $notes = "Automatically published SamarinaPOS Windows installer from the successful SamarinaPOS build.`n`n**Alternative download (GoFile):** $env:GOFILE_URL`n`nDownload **SamarinaPOS-Windows-Installer.exe** below. This release contains the installer only."
          $payload = @{
            tag_name = $tag
            name = "SamarinaPOS $tag"
            body = $notes
            draft = $false
            prerelease = $true
            make_latest = 'false'
          } | ConvertTo-Json -Depth 4
          try {
            $release = Invoke-RestMethod -Method Get -Uri "$api/releases/tags/$tag" -Headers $headers
            $release = Invoke-RestMethod -Method Patch -Uri "$api/releases/$($release.id)" -Headers $headers -ContentType 'application/json' -Body $payload
          } catch {
            $status = $_.Exception.Response.StatusCode.value__
            if ($status -ne 404) { throw }
            $release = Invoke-RestMethod -Method Post -Uri "$api/releases" -Headers $headers -ContentType 'application/json' -Body $payload
          }
          foreach ($asset in @($release.assets | Where-Object { $_.name -eq $installer.Name })) {
            Invoke-RestMethod -Method Delete -Uri "$api/releases/assets/$($asset.id)" -Headers $headers | Out-Null
          }
          $uploadUrl = "https://uploads.github.com/repos/$owner/$repo/releases/$($release.id)/assets?name=$([uri]::EscapeDataString($installer.Name))"
          & curl.exe --fail --silent --show-error --location --request POST --header "Authorization: Bearer $env:GH_TOKEN" --header 'Accept: application/vnd.github+json' --header 'Content-Type: application/octet-stream' --data-binary "@$($installer.FullName)" $uploadUrl
          if ($LASTEXITCODE -ne 0) { throw "GitHub release asset upload failed with exit code $LASTEXITCODE." }
          $assets = Invoke-RestMethod -Method Get -Uri "$api/releases/$($release.id)/assets" -Headers $headers
          if (-not (@($assets | Where-Object { $_.name -eq $installer.Name }).Count)) { throw 'Installer asset was not present after upload.' }
          Write-Host "Published prerelease $tag with $($installer.Name)."

