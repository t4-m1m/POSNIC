name: Quick Windows Installer EXE (no tests)
# Priority rebuild requested 2026-10-27; branch concurrency cancels the older installer run.
# Priority rebuild retry requested 2026-10-27 19:14 local.
# Build the current feature-branch snapshot as the Windows installer only; deliberately no test steps.
# Build the installer on each push to the active feature branch; manual dispatch remains available.
# 2026-11-16: user-requested rebuild of the current feature-branch snapshot (packaging trigger only; no application code changes).

on:
  push:
    branches:
      - feat/article-cost-label-designer-sales-calendar
      - feat/posnic-v2-rebrand
    tags:
      - 'v*-rebrand*'
  workflow_dispatch:

permissions:
  contents: write

# Only build the newest snapshot; rapid fix commits must not publish stale installers.
concurrency:
  group: posnic-windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows installer only without running tests
    runs-on: windows-latest
    env:
      POSNIC_MINIFY: "0"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Create annotated Saint Marina POS pre-release tag
        if: github.ref == 'refs/heads/feat/posnic-v2-rebrand'
        uses: actions/github-script@v8
        with:
          script: |
            const tag = 'v2.0.0-rebrand.1';
            try {
              const existing = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`
              });
              if (existing.data.object.sha === context.sha) {
                core.info(`Tag ${tag} already points to this commit.`);
                return;
              }
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`
              });
              core.info(`Moving test-only prerelease tag ${tag} to the current branch commit.`);
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const annotated = await github.rest.git.createTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag,
              message: 'Saint Marina POS v2 Rebrand Pre-Release 1',
              object: context.sha,
              type: 'commit'
            });
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tag}`,
              sha: annotated.data.sha
            });
            core.info(`Created annotated tag ${tag} at ${context.sha}.`);

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install root dependencies
        run: npm ci

      - name: Install API dependencies
        working-directory: api
        run: npm install --no-audit --no-fund

      - name: Syntax-check every tracked application JavaScript file
        shell: pwsh
        run: |
          $files = @(git ls-files | Where-Object {
            $_ -match '^(src|api|frontend-v2|frontend/mobile)/.*\.js$' -and
            $_ -notmatch '(^|/)node_modules/'
          })
          if ($files.Count -eq 0) { throw "No tracked application JavaScript files were found." }
          $failed = @()
          foreach ($file in $files) {
            node --check $file
            if ($LASTEXITCODE -ne 0) { $failed += $file }
          }
          if ($failed.Count -gt 0) {
            $failed | ForEach-Object { Write-Error "Syntax error: $_" }
            throw "$($failed.Count) of $($files.Count) JavaScript files failed syntax verification."
          }
          Write-Host "All $($files.Count) tracked application JavaScript files passed node --check."
      
      - name: Fetch bundled MongoDB
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep -oE 'set MONGODB_VERSION=[0-9.]+' src/download-mongodb.bat | cut -d= -f2)
          curl -fsSL -o mongodb.zip "https://fastdl.mongodb.org/windows/mongodb-windows-x86_64-${VERSION}.zip"
          7z x -bso0 mongodb.zip -omongodb-temp
          mkdir -p mongodb/bin
          cp "mongodb-temp/mongodb-win32-x86_64-windows-${VERSION}/bin/mongod.exe" mongodb/bin/
          for dll in msvcp140.dll vcruntime140.dll vcruntime140_1.dll; do
            cp "/c/Windows/System32/$dll" mongodb/bin/
          done
          rm -rf mongodb.zip mongodb-temp
          node scripts/check-mongodb-binaries.js

      - name: Prepare bundled app resources
        run: npm run prepare:bundle

      - name: Build Windows installer only
        run: npx electron-builder --win nsis --x64 --publish never --config.compression=maximum --config.win.verifyUpdateCodeSignature=false

      - name: Normalize installer filename
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path "dist/*-windows-x64-installer.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows installer, found $($installers.Count)."
          }
          Move-Item -LiteralPath $installers[0].FullName -Destination "dist/SaintMarinaPOS-Windows-Installer.exe" -Force

      - name: Mirror installer to GoFile (free third-party host)
        id: gofile
        continue-on-error: true
        shell: pwsh
        run: |
          $installer = Get-Item "dist/SaintMarinaPOS-Windows-Installer.exe"
          $response = Invoke-RestMethod -Uri "https://upload.gofile.is/uploadfile" -Method Post -Form @{ file = $installer }
          if ($response.status -ne "ok") {
            throw "GoFile upload failed: $($response.status)"
          }
          $url = $response.data.downloadPage
          if (-not $url -and $response.data.code) {
            $url = "https://gofile.is/d/$($response.data.code)"
          }
          if (-not $url) {
            throw "GoFile upload returned no share URL."
          }
          "download_url=$url" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "### Alternative installer download (GoFile)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "$url" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: SaintMarinaPOS-Windows-Installer
          path: dist/SaintMarinaPOS-Windows-Installer.exe
          if-no-files-found: error
          retention-days: 7

      - name: Publish installer to GitHub Pre-Release
        if: github.ref == 'refs/heads/feat/posnic-v2-rebrand' || startsWith(github.ref, 'refs/tags/v2.0.0-rebrand')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GOFILE_URL: ${{ steps.gofile.outputs.download_url }}
        run: |
          $ErrorActionPreference = 'Stop'
          $owner = 't4-m1m'
          $repo = 'POSNIC'
          $tag = if ($env:GITHUB_REF.StartsWith('refs/tags/')) { $env:GITHUB_REF_NAME } else { 'v2.0.0-rebrand.1' }
          $installer = Get-Item 'dist/SaintMarinaPOS-Windows-Installer.exe'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $api = "https://api.github.com/repos/$owner/$repo"
          $notes = "Automatically published Saint Marina POS Windows installer from the successful POSNIC Next build.`n`n**Alternative download (GoFile):** $env:GOFILE_URL`n`nDownload **SaintMarinaPOS-Windows-Installer.exe** below. This release contains the installer only."
          $payload = @{
            tag_name = $tag
            name = "Saint Marina POS $tag"
            body = $notes
            draft = $false
            prerelease = $true
            make_latest = 'false'
          } | ConvertTo-Json -Depth 4
          try {
            $release = Invoke-RestMethod -Method Get -Uri "$api/releases/tags/$tag" -Headers $headers
            $release = Invoke-RestMethod -Method Patch -Uri "$api/releases/$($release.id)" -Headers $headers -ContentType 'application/json' -Body $payload
          } catch {
            $status = $_.Exception.Response.StatusCode.value__
            if ($status -ne 404) { throw }
            $release = Invoke-RestMethod -Method Post -Uri "$api/releases" -Headers $headers -ContentType 'application/json' -Body $payload
          }
          foreach ($asset in @($release.assets | Where-Object { $_.name -eq $installer.Name })) {
            Invoke-RestMethod -Method Delete -Uri "$api/releases/assets/$($asset.id)" -Headers $headers | Out-Null
          }
          $uploadUrl = "https://uploads.github.com/repos/$owner/$repo/releases/$($release.id)/assets?name=$([uri]::EscapeDataString($installer.Name))"
          & curl.exe --fail --silent --show-error --location --request POST --header "Authorization: Bearer $env:GH_TOKEN" --header 'Accept: application/vnd.github+json' --header 'Content-Type: application/octet-stream' --data-binary "@$($installer.FullName)" $uploadUrl
          if ($LASTEXITCODE -ne 0) { throw "GitHub release asset upload failed with exit code $LASTEXITCODE." }
          $assets = Invoke-RestMethod -Method Get -Uri "$api/releases/$($release.id)/assets" -Headers $headers
          if (-not (@($assets | Where-Object { $_.name -eq $installer.Name }).Count)) { throw 'Installer asset was not present after upload.' }
          Write-Host "Published prerelease $tag with $($installer.Name)."

