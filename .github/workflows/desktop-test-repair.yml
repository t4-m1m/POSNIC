name: Repair desktop i18n and ignore checks
on:
  push:
    branches: [fix/ci-desktop-and-release]
    paths:
      - .github/workflows/desktop-test-repair.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/ci-desktop-and-release
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Regenerate the canonical English catalogue
        run: node tests/tools/i18n-coverage.js --write-english
      - name: Complete Nepali translations and ignore downloaded runtime
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          english_path = Path('languages/_english.json')
          nepali_path = Path('languages/ne.json')
          english = json.loads(english_path.read_text(encoding='utf-8'))
          nepali = json.loads(nepali_path.read_text(encoding='utf-8'))
          translated = {
            'lang_store_logo_optional': 'स्टोरको लोगो (वैकल्पिक)',
            'lang_remove_store_logo': 'स्टोरको लोगो हटाउनुहोस्',
            'lang_saved_label_templates': 'सुरक्षित गरिएका लेबल टेम्प्लेटहरू',
            'lang_choose_a_saved_template': 'सुरक्षित टेम्प्लेट छान्नुहोस्',
            'lang_save_current_as_template': 'हालको डिजाइन टेम्प्लेटका रूपमा सुरक्षित गर्नुहोस्',
            'lang_load_template': 'टेम्प्लेट लोड गर्नुहोस्',
            'lang_delete_template': 'टेम्प्लेट मेटाउनुहोस्',
            'lang_templates_are_saved_in_this_browser_for_th': 'टेम्प्लेटहरू यस ब्राउजरमा सुरक्षित हुन्छन्।',
            'lang_in_the_sample_preview_drag_an_outlined_fie': 'नमूना पूर्वावलोकनमा बाहिरी रेखा भएको क्षेत्र तानेर सार्नुहोस्।',
            'lang_reusable_label_templates': 'पुनः प्रयोग गर्न मिल्ने लेबल टेम्प्लेटहरू',
            'lang_generate_internal_barcode': 'आन्तरिक बारकोड बनाउनुहोस्',
            'lang_enter_a_template_name': 'टेम्प्लेटको नाम लेख्नुहोस्',
            'lang_choose_a_png_jpeg_or_webp_logo_smaller_tha': 'PNG, JPEG वा WebP लोगो छान्नुहोस् (आकार सीमा भित्र)',
            'lang_store_logo_added_to_the_label_design': 'लेबल डिजाइनमा स्टोरको लोगो थपियो',
            'lang_could_not_read_the_logo_image': 'लोगोको तस्बिर पढ्न सकिएन',
            'lang_store_logo_removed': 'स्टोरको लोगो हटाइयो',
            'lang_template_deleted_2': 'टेम्प्लेट मेटाइयो'
          }
          for key, value in translated.items():
              if key not in english:
                  raise SystemExit(f'Missing English source key: {key}')
              nepali[key] = value
          nepali_path.write_text(json.dumps(nepali, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          ignore = Path('.gitignore')
          lines = ignore.read_text(encoding='utf-8').splitlines()
          if 'nodejs/' not in lines:
              lines.append('nodejs/')
          ignore.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Verify catalogue and translation baseline
        run: |
          node tests/tools/i18n-coverage.js --write-english
          node tests/tools/i18n-coverage.js --missing ne
      - name: Commit only generated data and ignore rules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add languages/_english.json languages/ne.json .gitignore
          git commit -m "fix: repair desktop translation and MongoDB ignore checks"
          git push origin HEAD:fix/ci-desktop-and-release
