name: One-off Prettier formatting
on:
  push:
    branches: [fix/prettier-item-files]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install API dependencies
        working-directory: api
        run: npm ci
      - name: Format the remaining CI files
        working-directory: api
        run: npx prettier --write src/controllers/ask-posnic.controller.js src/controllers/auth-utils.controller.js
      - name: Commit formatter output to this branch
        run: |
          if git diff --quiet; then
            echo "Files already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/src/controllers/ask-posnic.controller.js api/src/controllers/auth-utils.controller.js
          git commit -m "Format auth and Ask Posnic controllers"
          git push origin HEAD
